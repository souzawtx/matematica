<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<meta name="theme-color" content="#eef0f6"/>
<script>(function(){var t=null;try{t=localStorage.getItem('mxp_theme')}catch(e){}if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t})()</script>
<title>MathXP</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--acc:#7c3aed;--acc-soft:#f3e8ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef0f6;color:#171a26}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid #d8dbe6;border-radius:10px;width:100%;background:#fff;color:#171a26}
textarea{min-height:90px;resize:vertical}
input[type=file]{padding:8px;background:#f8f9fc}
input[type=color]{padding:4px;height:44px}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 6px;color:#333849}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:#fff;color:#333849;border:1px solid #d8dbe6}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#f8f9fc;border:1px solid #e3e6f0;border-radius:16px;padding:20px}
.badge{font-size:11px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:999px;display:inline-block}
.b-green{background:#d9f3e8;color:#0f766e}.b-purple{background:var(--acc-soft);color:var(--acc)}.b-amber{background:#fdf3d7;color:#92600a}.b-gray{background:#e8eaf1;color:#565b6e}.b-red{background:#fde5e6;color:#b3261e}
.bar{height:8px;background:#e3e6f0;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid #e3e6f0;text-align:left}.tbl th{font-size:12px;color:#565b6e;text-transform:uppercase;letter-spacing:.4px}
.muted{color:#565b6e;font-size:14px}.tiny{color:#7a7f93;font-size:12px}
h1{font-size:26px}h2{font-size:19px;margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.brandimg{border-radius:14px;background:#0b0b0f;object-fit:contain;display:inline-block}
.sllogo{background:linear-gradient(135deg,#c084fc,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;letter-spacing:1px;display:inline-block}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth{width:100%;max-width:430px;background:#f8f9fc;border:1px solid #e3e6f0;border-radius:18px;padding:28px;text-align:center}
.logo{font-size:20px;font-weight:800;display:flex;gap:10px;justify-content:center;align-items:center}
.tabs{display:flex;background:#eceef5;border-radius:12px;padding:4px;margin:18px 0}
.tabs button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:#565b6e}
.tabs button.on{background:#fff;color:var(--acc);box-shadow:0 1px 4px #0001}
.err{background:#fde5e6;color:#b3261e;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;text-align:left}
.ok-note{background:#d9f3e8;color:#0f766e;border-radius:10px;padding:8px;font-size:13px;margin-top:8px;text-align:left}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#f8f9fc;border-right:1px solid #e3e6f0;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{justify-content:flex-start;padding:6px 10px 16px}
.navb{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;color:#4b5065;font-weight:600;width:100%;text-align:left}
.navb.on{background:var(--acc-soft);color:var(--acc)}
.side .foot{margin-top:auto;border-top:1px solid #e3e6f0;padding-top:12px;display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:800;display:grid;place-items:center;flex:none;font-size:16px}
.top{padding:12px 22px;background:#f8f9fc;border-bottom:1px solid #e3e6f0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:#fff;border:1px solid #e3e6f0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.page{padding:26px 22px;max-width:1040px;margin:0 auto;width:100%}
.mobnav{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.mobnav{display:flex;overflow-x:auto;gap:8px;padding:10px 14px;background:#f8f9fc;border-bottom:1px solid #e3e6f0}.mobnav .navb{width:auto;white-space:nowrap;border:1px solid #e3e6f0;background:#fff}}
.empty{border:1px dashed #cfd3e2;border-radius:16px;padding:34px;text-align:center;color:#565b6e}
.empty .ico{width:46px;height:46px;border-radius:50%;background:var(--acc-soft);display:grid;place-items:center;margin:0 auto 12px;font-size:20px}
.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:18px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:24px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171a26;color:#fff;padding:12px 20px;border-radius:12px;z-index:99;font-size:14px;box-shadow:0 6px 24px #0004}
.opt{display:flex;gap:10px;align-items:center;border:1px solid #d8dbe6;border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;font-weight:400}
.opt input{width:auto}
.mimg-wrap{display:flex;justify-content:center;align-items:center;margin-top:14px;background:#fff;border:1px solid #e3e6f0;border-radius:14px;padding:10px;box-shadow:0 4px 14px #00000012}
.mimg{max-width:100%;max-height:420px;width:auto;height:auto;object-fit:contain;border-radius:10px;display:block;cursor:zoom-in}
.zoomwrap{position:fixed;inset:0;background:#000000dd;z-index:80;overflow:auto;display:flex}
.zoomwrap img{margin:auto;max-width:96vw;max-height:96vh;object-fit:contain;cursor:zoom-in;border-radius:8px;background:#fff}
.zoomwrap img.full{max-width:none;max-height:none;cursor:zoom-out}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:10px;flex:none;border:1px solid #e3e6f0}
.fx-negrito{font-weight:800}
.fx-italico{font-style:italic}
.fx-neon{text-shadow:0 0 6px currentColor,0 0 14px currentColor}
.fx-rainbow{background:linear-gradient(90deg,#f43f5e,#f59e0b,#10b981,#3b82f6,#8b5cf6,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rbw 3s linear infinite;background-size:200% 100%}
@keyframes rbw{to{background-position:200% 0}}
.sym-anim{display:inline-block;animation:hue 4s linear infinite}
@keyframes hue{0%{filter:hue-rotate(0deg) drop-shadow(0 0 5px #7c3aed)}100%{filter:hue-rotate(360deg) drop-shadow(0 0 5px #7c3aed)}}
/* ===== Intro MathXP (entrar / criar conta) ===== */
#mxIntro{position:fixed;inset:0;z-index:98;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 50% 50%,#3b1a86 0%,#12082e 55%,#05030f 100%);animation:mxIn .25s ease-out both}
#mxIntro.out{animation:mxOut 3.6s ease-in forwards}
@keyframes mxIn{from{opacity:0}to{opacity:1}}
@keyframes mxOut{from{opacity:1}to{opacity:0}}
.mx-w{position:relative;animation:mxShake .55s .42s both}
@keyframes mxShake{0%,100%{transform:translate(0)}15%{transform:translate(-14px,8px)}30%{transform:translate(12px,-10px)}45%{transform:translate(-9px,-6px)}60%{transform:translate(8px,7px)}80%{transform:translate(-3px,2px)}}
.mx-t{display:flex;font:900 min(22vw,30vh,300px)/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.03em;white-space:nowrap}
#mxIntro.out .mx-t{animation:mxShrink 3.6s cubic-bezier(.5,0,.6,1) forwards}
@keyframes mxShrink{from{transform:scale(1)}to{transform:scale(.1)}}
.mx-t span{display:inline-block;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(100deg,#fff,#e9d5ff 25%,#67e8f9 50%,#f0abfc 75%,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 22px rgba(167,139,250,.95)) drop-shadow(0 0 70px rgba(124,58,237,.8));animation:mxPop .9s cubic-bezier(.2,1.7,.35,1) calc(var(--i)*.07s) both,mxShine 2.6s linear calc(1s + var(--i)*.07s) infinite}
@keyframes mxPop{0%{opacity:0;transform:scale(0) rotate(-35deg)}55%{opacity:1;transform:scale(1.4) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes mxShine{from{background-position:0 0}to{background-position:300% 0}}
.mx-flash{position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 65%);opacity:0;animation:mxFlash .9s ease-out .4s both;pointer-events:none}
@keyframes mxFlash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
.mx-ring{position:absolute;left:50%;top:50%;width:10px;height:10px;border:5px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:mxRing 1.6s cubic-bezier(.1,.8,.3,1) .45s both;pointer-events:none}
.mx-ring.r2{border-color:rgba(167,139,250,.9);animation-delay:.65s}
@keyframes mxRing{0%{opacity:1;width:10px;height:10px}100%{opacity:0;width:170vmax;height:170vmax}}
.mx-p{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);opacity:0;animation:mxBurst var(--t) cubic-bezier(.12,.75,.25,1) both;pointer-events:none}
.mx-p.sy{width:auto;height:auto;margin:0;border-radius:0;background:none;box-shadow:none;color:var(--c);font:800 var(--s)/1 system-ui,sans-serif;text-shadow:0 0 10px var(--c)}
@keyframes mxBurst{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}5%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1) rotate(var(--r))}}
@keyframes mxFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.mx-flash,.mx-ring,.mx-p{display:none}.mx-w{animation:none}.mx-t span{animation:mxFade .8s both}}
/* ===== Papel de parede MathXP (aba Bem-vindo) ===== */
.wp{position:relative;border-radius:22px;overflow:hidden;color:#fff;background:#0a023f}
.wp-hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;width:100%;aspect-ratio:16/9;min-height:360px;max-height:82vh;padding:24px 16px;background:url('wallpaper.jpg') center/cover no-repeat,radial-gradient(circle at 20% 15%,rgba(124,58,237,.9) 0,transparent 45%),radial-gradient(circle at 85% 30%,rgba(6,182,212,.6) 0,transparent 40%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#0f172a)}
.wp-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,transparent,#0a023f);pointer-events:none}
.wp-hero>*{position:relative;z-index:1}
.wp-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(15,10,50,.55);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:13px;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wp-body{padding:4px clamp(12px,3vw,28px) 36px}
.wp-card{max-width:860px;margin:0 auto;padding:24px 26px;border-radius:20px;background:rgba(14,9,48,.72);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);line-height:1.7;text-align:left}
.wp-card h2{color:#fff;font-size:clamp(22px,4vw,30px);margin:4px 0 2px}
.wp-card h3{color:#fff;font-size:clamp(18px,3vw,22px);margin:30px 0 8px;padding-left:12px;border-left:4px solid #a78bfa}
.wp-card h4{color:#e9d5ff;font-size:16px;margin:20px 0 4px}
.wp-card p{color:rgba(255,255,255,.92);margin:8px 0}
.wp-card ul,.wp-card ol{margin:8px 0 8px 22px;color:rgba(255,255,255,.92)}
.wp-card b{color:#fff}
@media (max-width:700px){.wp-hero{aspect-ratio:auto;min-height:540px;max-height:none;justify-content:flex-end;padding-bottom:46px;background-position:4% center,0 0,0 0,0 0}}
/* ===== Personagem RPG ===== */
.cr-wrap{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;margin-top:14px;align-items:start}
@media (max-width:900px){.cr-wrap{grid-template-columns:1fr}}
.cr-stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 16px;border-radius:20px;background:radial-gradient(circle at 50% 32%,#5b34c4 0,#2a1462 58%,#150a33 100%);border:1px solid rgba(167,139,250,.4);position:relative;overflow:hidden;color:#fff}
.cr-stage::before{content:"";position:absolute;left:16%;right:16%;bottom:128px;height:26px;border-radius:50%;background:radial-gradient(ellipse,rgba(196,167,255,.55),transparent 70%);pointer-events:none}
.cr-stage canvas{position:relative;z-index:1;width:min(300px,62vw);height:auto;aspect-ratio:40/56;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.mx3d{position:relative;width:100%;height:min(440px,92vw);min-height:300px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(139,92,246,.4) 0,rgba(42,20,98,.25) 55%,transparent 100%)}
.mx3d.off{height:auto;min-height:0;background:none}
.mx3d-load{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;opacity:.85;pointer-events:none}
.mx3d-ctl{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.mx3d-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mx3d-hint{font-size:11px;opacity:.75;text-align:center}
.cr-stage input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff}
.cr-tabs{display:flex;flex-wrap:wrap;gap:6px}
.cr-tab{border:1px solid rgba(124,58,237,.35);background:transparent;color:inherit;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.cr-tab.on{background:#7c3aed;color:#fff;border-color:transparent}
.cr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:14px}
.cr-i{position:relative;border:2px solid rgba(124,58,237,.25);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;background:rgba(124,58,237,.07);transition:transform .12s,box-shadow .12s}
.cr-i:hover{transform:translateY(-2px)}
.cr-i img{width:84px;height:84px;object-fit:contain;image-rendering:pixelated;display:block;margin:0 auto 4px}
.cr-i.on{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(124,58,237,.3),0 0 16px rgba(167,139,250,.55)}
.cr-i.lk{opacity:.55}
.cr-i .n{font-size:12.5px;font-weight:800;line-height:1.2}.cr-i .r{font-size:11px;font-weight:800;margin-top:3px}.cr-i .d{font-size:10.5px;opacity:.75;line-height:1.25;margin-top:2px}
/* ===== Loja RPG ===== */
.sh-hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 20px;border-radius:20px;background:linear-gradient(120deg,#4c1d95,#7c3aed 55%,#2563eb);color:#fff;box-shadow:0 10px 30px rgba(76,29,149,.35);position:relative;overflow:hidden}
.sh-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.25),transparent 45%);pointer-events:none}
.sh-hero h1{margin:0;color:#fff}.sh-hero p{margin:4px 0 0;opacity:.92}
.sh-coins{position:relative;z-index:1;font-weight:900;font-size:22px;background:rgba(0,0,0,.28);padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.3)}
.sh-fil{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sh-chip{border:1px solid rgba(124,58,237,.35);background:transparent;color:inherit;border-radius:99px;padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer;transition:transform .15s}
.sh-chip:hover{transform:translateY(-1px)}.sh-chip.on{background:#7c3aed;color:#fff;border-color:transparent}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;margin-top:16px}
.sh-card{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 12px 14px;border-radius:18px;border:2px solid rgba(124,58,237,.25);background:linear-gradient(180deg,rgba(124,58,237,.08),transparent);transition:transform .18s,box-shadow .18s;animation:shIn .4s both}
.sh-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,.25)}
.sh-card.r1{border-color:rgba(34,197,94,.55)}.sh-card.r2{border-color:rgba(59,130,246,.7)}.sh-card.r3{border-color:#a855f7;box-shadow:0 0 14px rgba(168,85,247,.28)}
.sh-card.r4{border-color:#f59e0b;box-shadow:0 0 20px rgba(245,158,11,.4);animation:shIn .4s both,shGold 2.4s ease-in-out infinite}
.sh-card.r5{border:2px solid transparent;background:linear-gradient(#1b1038,#1b1038) padding-box,linear-gradient(120deg,#f472b6,#22d3ee,#a78bfa,#f472b6) border-box;background-size:100% 100%,300% 300%;color:#fff;animation:shIn .4s both,shMyth 3s linear infinite}
.sh-card.r5 .sh-d{opacity:.85}
.sh-pv{display:grid;place-items:center;height:176px;border-radius:14px;background:radial-gradient(circle at 50% 75%,rgba(124,58,237,.4),rgba(20,10,50,.15));overflow:hidden}
.pr-item{display:flex;align-items:center;gap:12px}.pr-pv{width:72px;height:72px;flex:none;display:grid;place-items:center;font-size:34px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 75%,rgba(124,58,237,.4),rgba(20,10,50,.15))}.pr-pv img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}img.m3{image-rendering:auto!important;object-fit:contain}
.sh-pv img{width:164px;height:164px;object-fit:contain;image-rendering:pixelated;transition:transform .25s}.sh-card:hover .sh-pv img{transform:scale(1.1) translateY(-3px)}
.sh-rar{position:absolute;top:8px;left:8px;z-index:1;font-size:10.5px;font-weight:900;color:#fff;padding:3px 8px;border-radius:99px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.sh-own{position:absolute;top:8px;right:8px;z-index:1;font-size:10.5px;font-weight:900;background:#16a34a;color:#fff;padding:3px 8px;border-radius:99px}
.sh-n{font-size:14px}.sh-d{font-size:12px;opacity:.75;margin:0;min-height:31px;line-height:1.3}
.sh-f{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}.sh-pr{font-weight:900}
.sh-pop{position:fixed;inset:0;z-index:97;display:grid;place-items:center;background:rgba(10,5,30,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:mxIn .2s both}
.sh-popc{width:min(360px,90vw);text-align:center;padding:22px;border-radius:22px;background:linear-gradient(160deg,#3b1d8a,#1b1038);color:#fff;border:1px solid rgba(167,139,250,.5);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:shPop .45s cubic-bezier(.2,1.5,.4,1) both}
.sh-popc img{width:208px;height:208px;object-fit:contain;image-rendering:pixelated}.sh-popc h2{margin:6px 0;color:#fff}.sh-spark{font-size:30px;animation:shSpin 1.2s ease-in-out infinite alternate}
@keyframes shIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shGold{0%,100%{box-shadow:0 0 14px rgba(245,158,11,.35)}50%{box-shadow:0 0 28px rgba(251,191,36,.7)}}
@keyframes shMyth{from{background-position:0 0,0% 50%}to{background-position:0 0,300% 50%}}
@keyframes shPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ================= DADOS ================= */

 {id:'th_floresta',name:'Tema Floresta Fractal',price:120,desc:'Verde das árvores de fractais.',icon:'🌲',effect:{type:'theme',value:{acc:'#059669',soft:'#d9f3e8'}}},
 {id:'th_oceano',name:'Tema Oceano Profundo',price:120,desc:'Azul das ondas senoidais.',icon:'🌊',effect:{type:'theme',value:{acc:'#0284c7',soft:'#dbeafe'}}},
 {id:'th_brasas',name:'Tema Vermelho Exponencial',price:120,desc:'Vermelho de quem cresce em ritmo exponencial.',icon:'🐲',effect:{type:'theme',value:{acc:'#dc2626',soft:'#fee2e2'}}},
 {id:'sy_pi',name:'Símbolo Pi',price:100,desc:'O número mais famoso ao lado do seu nome.',icon:'π',effect:{type:'symbol',value:{e:'π'}}},

 {id:'av_robo',name:'Avatar Robô Calculadora',price:90,desc:'Faz contas na velocidade da luz.',icon:'🤖',effect:{type:'avatar',value:'🤖'}},
 {id:'av_abaco',name:'Avatar Ábaco',price:70,desc:'O clássico da contagem.',icon:'🧮',effect:{type:'avatar',value:'🧮'}}];
const DEFAULT_ACH=[
 {id:'m1',name:'Primeira Missão',desc:'Conclua sua primeira missão de matemática.',coins:10,cond:u=>doneCount(u)>=1},
 {id:'m3',name:'Calculista Constante',desc:'Conclua 3 missões.',coins:20,cond:u=>doneCount(u)>=3},
 {id:'m5',name:'Maratonista de Missões',desc:'Conclua 5 missões.',coins:30,cond:u=>doneCount(u)>=5},
 {id:'m10',name:'Lenda do MathXP',desc:'Conclua 10 missões.',coins:50,cond:u=>doneCount(u)>=10},
 {id:'m20',name:'Calculadora Humana',desc:'Conclua 20 missões.',coins:80,cond:u=>doneCount(u)>=20},
 {id:'num',name:'Mestre dos Números',desc:'Acerte uma missão de números e operações.',coins:10,cond:u=>skillDone(u,'num')>=1},
 {id:'frac',name:'Rei das Frações',desc:'Acerte uma missão de frações e decimais.',coins:15,cond:u=>skillDone(u,'frac')>=1},
 {id:'alg',name:'Caçador de Incógnitas',desc:'Acerte uma missão de álgebra e equações.',coins:15,cond:u=>skillDone(u,'alg')>=1},
 {id:'geo',name:'Explorador de Formas',desc:'Acerte uma missão de geometria e medidas.',coins:15,cond:u=>skillDone(u,'geo')>=1},
 {id:'prob',name:'Resolvedor de Problemas',desc:'Acerte uma missão de problemas e raciocínio lógico.',coins:15,cond:u=>skillDone(u,'prob')>=1},
 {id:'all5',name:'Matemático Completo',desc:'Acerte pelo menos uma missão em cada área da matemática.',coins:50,cond:u=>SKILLS.every(k=>skillDone(u,k[0])>=1)},
 {id:'b3',name:'Explorador de Assuntos',desc:'Conclua missões de 3 assuntos diferentes.',coins:25,cond:u=>booksDone(u)>=3},
 {id:'lv2',name:'Nível 2',desc:'Acumule 100 XP.',coins:25,cond:u=>levelOf(u.xp)>=2},
 {id:'lv3',name:'Nível 3',desc:'Acumule 150 XP.',coins:40,cond:u=>levelOf(u.xp)>=3},
 {id:'lv4',name:'Nível 4',desc:'Acumule 200 XP.',coins:50,cond:u=>levelOf(u.xp)>=4},
 {id:'lv5',name:'Nível 5',desc:'Acumule 300 XP.',coins:60,cond:u=>levelOf(u.xp)>=5},
 {id:'rich',name:'Cofre Cheio',desc:'Junte 100 moedas.',coins:10,cond:u=>u.coins>=100}];
const PROF_ACH=[
 {id:'p1',name:'Primeira Publicação',desc:'Publique sua primeira missão.',coins:10,cond:u=>pubCount(u)>=1},
 {id:'p5',name:'Editor do MathXP',desc:'Publique 5 missões.',coins:20,cond:u=>pubCount(u)>=5},
 {id:'p10',name:'Mestre das Trilhas',desc:'Publique 10 missões.',coins:30,cond:u=>pubCount(u)>=10},
 {id:'c10',name:'Avaliador Dedicado',desc:'Confirme 10 conclusões de alunos.',coins:15,cond:u=>confCount(u)>=10},
 {id:'c50',name:'Mentor do MathXP',desc:'Confirme 50 conclusões de alunos.',coins:30,cond:u=>confCount(u)>=50},
 {id:'t30',name:'Turmas Crescendo',desc:'Tenha 30 alunos vinculados no total.',coins:20,cond:u=>studentsTotal(u)>=30},
 {id:'plv2',name:'Nível 2',desc:'Acumule 100 XP.',coins:25,cond:u=>levelOf(u.xp)>=2},
 {id:'plv3',name:'Nível 3',desc:'Acumule 150 XP.',coins:40,cond:u=>levelOf(u.xp)>=3}];
let db=loadDB(), session=localStorage.getItem(SES_KEY)||null;
let ui={authTab:'login',authError:'',sPage:'bemvindo',tPage:'bemvindo',selClass:null,modal:null,reveal:{}};
let pendingImage=null;
function loadDB(){try{const d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.users){d.teacherCodes=[TEACHER_CODE];d.shopItems=d.shopItems||[];d.achv=d.achv||[];return d}}catch(e){}return{users:[],classes:[],missions:[],responses:[],teacherCodes:[TEACHER_CODE],counters:{aluno:0,professor:0},shopItems:[],achv:[]}}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){toast('⚠️ Armazenamento do navegador cheio: remova missões com imagem.')}}
function me(){return db.users.find(u=>u.id===session)}
function precoDe(id,base){const r=(db.shopItems||[]).find(function(x){return x.id==='PRECO_'+id});return r?r.price:base}
function criados(){return(db.shopItems||[]).filter(function(i){return !i.ref})}
function allItems(){return DEFAULT_SHOP.concat(criados()).filter(function(i){return !i.consume&&!(i.effect&&i.effect.type==='xp')}).map(function(i){return Object.assign({},i,{price:precoDe(i.id,i.price)})})}
function allAch(){return DEFAULT_ACH.concat(db.achv||[])}
function achFor(u){return u.role==='professor'?PROF_ACH:allAch()}
function eqVal(u,type){if(!u||!u.equipped)return null;const id=u.equipped[type];if(!id)return null;const it=allItems().find(i=>i.id===id);return it&&it.effect?it.effect.value:null}
function displayName(s){const nc=eqVal(s,'nameColor');const sy=eqVal(s,'symbol');
 return`${sy?`<span class="${sy.anim?'sym-anim':''}" style="margin-right:4px">${escH(sy.e)}</span>`:''}<span style="${nc?'color:'+nc:''}">${escH(s.name)}</span>`}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function escH(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* ================= AVATAR E FOTO DE PERFIL ================= */
const AV_FREE=['🦊','🐼','🐯','🦁','🐸','🐵','🦉','🐙','🦄','🐲','🤖','👾','🚀','⭐','🔥','⚡','🎯','🧠','🧮','📐','📏','🎓','🏆','😎','🤓','🐱','🐶','🦋'];
function photoOK(p){return typeof p==='string'&&typeof SB_URL!=='undefined'&&p.indexOf(SB_URL+'/storage/v1/object/public/avatars/')===0}
function avatarInner(u){if(photoOK(u.photo)&&!u.photoOff)return `<img src="${escH(u.photo)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">`;
 if(u.char&&u.avatarMode!=='emoji'&&typeof mxPix==='function')return mxAvatarImg(u);
 return escH(u.avatar||eqVal(u,'avatar')||(u.name||'?')[0].toUpperCase())}
function avatarBox(u,px){return `<div class="avatar" style="width:${px}px;height:${px}px;font-size:${Math.round(px*.45)}px;overflow:hidden">${avatarInner(u)}</div>`}
function avatarEditor(u){const pbtn=`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" onclick="goPersonagem()">🧙 ${u.char?'Editar personagem':'Criar personagem'}</button></div>`,own=(u.inventory||[]).map(function(id){return allItems().find(function(i){return i.id===id})}).filter(function(i){return i&&i.effect&&i.effect.type==='avatar'}).map(function(i){return i.effect.value}),
 all=AV_FREE.concat(own.filter(function(e){return AV_FREE.indexOf(e)<0})),has=photoOK(u.photo);
 return pbtn+`<div class="row" style="justify-content:center;margin-top:10px;flex-wrap:wrap"><label class="btn sm" style="cursor:pointer;margin:0">📷 ${has?'Trocar foto':'Escolher foto'}<input type="file" accept="image/*" style="display:none" onchange="setPhoto(this)"></label>${has&&!u.photoOff?'<button class="btn ghost sm" onclick="removePhoto()">Remover foto</button>':''}${has&&u.photoOff?'<button class="btn ghost sm" onclick="usePhoto()">Usar minha foto</button>':''}</div>
 <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">Escolher avatar</summary><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px">${all.map(function(e){return `<button class="btn ghost sm" style="font-size:22px;padding:6px 10px${u.avatar===e&&(!has||u.photoOff)?';outline:2px solid var(--acc)':''}" onclick="setAvatar('${e}')">${e}</button>`}).join('')}</div></details>`}
const LEVEL_XP=[0,100,150,200,300]; /* XP TOTAL para chegar aos níveis 1,2,3,4,5. Depois disso: +100 XP por nível */
function xpFor(l){return l<=LEVEL_XP.length?LEVEL_XP[l-1]:LEVEL_XP[LEVEL_XP.length-1]+(l-LEVEL_XP.length)*100}
function levelOf(xp){let l=1;while(xp>=xpFor(l+1))l++;return l}
function lvInfo(xp){const l=levelOf(xp),a=xpFor(l),b=xpFor(l+1);return{l,cur:xp-a,need:b-a,left:b-xp}}
function fmtDate(d){if(!d)return'—';return new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}
function missionById(id){return db.missions.find(m=>m.id===id)}
function doneCount(u){return db.responses.filter(r=>r.studentId===u.id&&r.status==='ok').length}
function skillDone(u,s){return db.responses.filter(r=>r.studentId===u.id&&r.status==='ok'&&missionById(r.missionId)&&missionById(r.missionId).skill===s).length}
function booksDone(u){return new Set(db.responses.filter(r=>r.studentId===u.id&&r.status==='ok').map(r=>missionById(r.missionId)?missionById(r.missionId).book:null)).size}
function studentsOf(code){return db.users.filter(u=>u.role==='aluno'&&u.classCode===code)}
function myClasses(){return db.classes.filter(c=>c.teacherId===session)}
function myCodes(u){return db.classes.filter(c=>c.teacherId===(u?u.id:session)).map(c=>c.code)}
function pubCount(u){const codes=myCodes(u);return db.missions.filter(m=>codes.includes(m.classCode)).length}
function confCount(u){const codes=myCodes(u);const mids=db.missions.filter(m=>codes.includes(m.classCode)).map(m=>m.id);return db.responses.filter(r=>r.status==='ok'&&mids.includes(r.missionId)).length}
function studentsTotal(u){return myCodes(u).reduce((t,c)=>t+studentsOf(c).length,0)}
function selClass(){return db.classes.find(c=>c.code===ui.selClass)||myClasses()[0]}
function classOf(u){return db.classes.find(c=>c.code===u.classCode)}
function skillName(s){const k=SKILLS.find(x=>x[0]===s);return k?k[1]:s}
function statusOf(u,m){const rs=db.responses.filter(r=>r.missionId===m.id&&r.studentId===u.id);if(rs.some(r=>r.status==='ok'))return'done';if(rs.some(r=>r.status==='pending'))return'pending';const w=rs.filter(r=>r.status==='wrong');if(w.length)return w.some(r=>!r.released)?'failed':'retry';return'open'}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function copy(txt){if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Copiado: '+txt));else toast(txt)}
function emptyHTML(icon,t,d){return`<div class="empty" style="margin-top:18px"><div class="ico">${icon}</div><b>${t}</b><p class="muted" style="margin-top:6px">${d}</p></div>`}
/* ================= IMAGEM ================= */
function onMissionImage(input){const f=input.files[0];if(!f)return;
 if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type))return toast('Use PNG, JPEG, WebP ou GIF.');
 const reader=new FileReader();
 reader.onload=e=>{const data=e.target.result;
  if(f.size<=800000){pendingImage=data;previewUpdate();toast('🖼 Imagem anexada com qualidade original.');return}
  const img=new Image();
  img.onload=()=>{let w=img.width,h=img.height;const max=1600;
   if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
   const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
   pendingImage=cv.toDataURL('image/jpeg',0.92);previewUpdate();toast('🖼 Imagem grande otimizada sem perda visível.')};
  img.onerror=()=>toast('Não foi possível ler a imagem.');
  img.src=data};
 reader.readAsDataURL(f)}

 return false}

function escAt(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function grantActivity(){const c=selClass();if(!c)return;
 const title=document.getElementById('at_title').value.trim(),xp=Math.max(0,Math.floor(+document.getElementById('at_xp').value||0)),coins=Math.max(0,Math.floor(+document.getElementById('at_coins').value||0));
 const ids=[...document.querySelectorAll('.at_s:checked')].map(x=>x.value);
 if(!title)return toast('Dê um nome à atividade.');
 if(!xp&&!coins)return toast('Informe XP e/ou moedas.');
 if(!ids.length)return toast('Marque pelo menos um aluno.');
 const ts=Date.now(),date=new Date(ts-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);let n=0,ach=0;
 ids.forEach((id,k)=>{const s=db.users.find(x=>x.id===id&&x.role==='aluno'&&x.classCode===c.code);if(!s)return;
  s.xp+=xp;s.coins+=coins;(s.activities=s.activities||[]).push({id:'T'+ts+'_'+k,ts,date,title,xp,coins});
  achFor(s).forEach(a=>{if(!s.achievements.includes(a.id)&&condOk(s,a)){s.achievements.push(a.id);s.coins+=a.coins;ach++}});n++});
 save();toast('✅ Recompensa dada a '+n+' aluno(s): +'+xp+' XP, +'+coins+' 🪙'+(ach?' · '+ach+' conquista(s) nova(s)':''));render()}
function undoActivity(uid,aid){const s=db.users.find(x=>x.id===uid);if(!s)return;const a=(s.activities||[]).find(x=>x.id===aid);if(!a)return;
 if(!confirm('Desfazer "'+a.title+'" de '+s.name+'? Remove '+a.xp+' XP e '+a.coins+' moedas.'))return;
 s.xp=Math.max(0,s.xp-a.xp);s.coins=Math.max(0,s.coins-a.coins);s.activities=s.activities.filter(x=>x.id!==aid);save();toast('Recompensa desfeita.');render()}

/* ================= INTRO MathXP (explosão + some devagar) ================= */
function mxBurst(o,n,dist,delay){const sym=['+','−','×','÷','π','∑','√','∞','%','='],col=['#c4b5fd','#f0abfc','#67e8f9','#fde047','#ffffff','#a78bfa'];
 for(let k=0;k<n;k++){const p=document.createElement('i'),a=Math.random()*6.283,d=dist*(.35+Math.random()*.65),sy=Math.random()<.4;
  p.className='mx-p'+(sy?' sy':'');if(sy)p.textContent=sym[k%sym.length];
  p.style.cssText=`--x:${(Math.cos(a)*d).toFixed(0)}px;--y:${(Math.sin(a)*d).toFixed(0)}px;--r:${((Math.random()-.5)*720).toFixed(0)}deg;--s:${(sy?18+Math.random()*28:5+Math.random()*10).toFixed(0)}px;--c:${col[k%col.length]};--t:${(1.1+Math.random()*1.2).toFixed(2)}s;animation-delay:${(delay+Math.random()*.15).toFixed(2)}s`;
  o.appendChild(p)}}
function introMathXP(){const old=document.getElementById('mxIntro');if(old)old.remove();
 const o=document.createElement('div');o.id='mxIntro';
 o.innerHTML='<div class="mx-flash"></div><div class="mx-ring"></div><div class="mx-ring r2"></div><div class="mx-w"><div class="mx-t">'+[...'MathXP'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')+'</div></div>';
 document.body.appendChild(o);
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const R=Math.max(innerWidth,innerHeight);mxBurst(o,70,R*.55,.45);mxBurst(o,45,R*.35,.5);mxBurst(o,30,R*.7,1.35)}
 setTimeout(()=>o.classList.add('out'),3000);
 o.addEventListener('animationend',e=>{if(e.target===o&&e.animationName==='mxOut')o.remove()});
 o.addEventListener('click',()=>{if(o._skip)return;o._skip=1;o.animate([{opacity:getComputedStyle(o).opacity},{opacity:0}],{duration:400,fill:'forwards'}).onfinish=()=>o.remove()})}

const ROTEIRO=`# MATHXP — APRENDER PARA EVOLUIR
### Roteiro de demonstração da plataforma

## 1. Apresentação inicial

O MathXP é uma plataforma educacional que utiliza a gamificação para transformar o aprendizado de Matemática em uma jornada de desafios, conquistas e evolução.

A plataforma aproxima a experiência de um jogo, na qual cada atividade realizada pode representar uma oportunidade de aprender, ganhar experiência, conquistar recompensas e avançar de nível.

O sistema possui dois perfis principais: estudante e professor.

## 2. Tela de acesso e cadastro

Ao acessar o MathXP, o usuário encontra a tela de entrada, onde pode fazer login ou criar uma conta.

Para criar uma conta, é necessário informar:
- Nome.
- E-mail.
- Senha.
- Código de professor, quando aplicável.

O estudante cria sua conta sem informar o código de professor. Já o professor utiliza um código de autorização para acessar as ferramentas de gerenciamento.

Após entrar, cada usuário encontra um ambiente personalizado de acordo com seu perfil.

## 3. Ambiente do estudante

### 3.1 Bem-vindo

O estudante encontra uma tela de boas-vindas com a identidade visual do MathXP.

Nela, aparecem seu avatar, nível atual, quantidade de XP e moedas acumuladas.

O botão de iniciar permite acessar sua jornada de aprendizagem.

### 3.2 Início

O painel inicial apresenta o progresso do estudante.

Nessa tela, ele consegue visualizar:
- Nível atual.
- XP acumulado.
- Barra de progresso para o próximo nível.
- Quantidade de missões concluídas.
- Próximas missões disponíveis.
- Diário de estudos.

Caso ainda não esteja vinculado a uma turma, poderá inserir o código disponibilizado pelo professor.

### 3.3 Jornada de aprendizagem

A Jornada é uma das principais funcionalidades do MathXP.

Nela ficam disponíveis as missões de Matemática publicadas pelo professor.

As atividades são organizadas em cinco áreas:

1. Números e operações.
2. Frações e decimais.
3. Álgebra e equações.
4. Geometria e medidas.
5. Problemas e raciocínio lógico.

Cada missão apresenta um título, assunto, habilidade trabalhada, prazo e recompensas disponíveis.

O estudante escolhe uma missão e inicia a resolução do desafio.

### 3.4 Resolução das missões

As missões podem apresentar diferentes formatos de resposta.

**Múltipla escolha:** o estudante analisa o enunciado e seleciona uma das alternativas. O sistema verifica automaticamente se a resposta está correta.

**Resposta escrita:** o estudante apresenta sua resolução, explicando o raciocínio utilizado. A resposta é enviada ao professor para correção e confirmação.

Quando uma missão é concluída corretamente, o estudante recebe a quantidade de XP e moedas estabelecida pelo professor.

Quando erra uma questão de múltipla escolha, a missão fica encerrada até que o professor eventualmente libere uma nova tentativa.

Também existe a possibilidade de praticar novamente uma missão, sem receber novas recompensas.

### 3.5 Sistema de XP e níveis

O XP representa a experiência acumulada durante a jornada.

À medida que o estudante conclui atividades e recebe recompensas, sua experiência aumenta.

Quando alcança os requisitos necessários, avança para o próximo nível.

Esse sistema permite visualizar sua evolução e estabelecer novas metas de aprendizagem.

### 3.6 Sistema de moedas

Além do XP, o estudante acumula moedas virtuais.

Enquanto o XP representa experiência e progressão, as moedas funcionam como dinheiro virtual dentro da plataforma.

Elas podem ser utilizadas na loja para adquirir itens disponíveis.

### 3.7 Ranking

O Ranking apresenta a classificação dos estudantes da mesma turma, de acordo com a quantidade de XP acumulada.

A classificação permite acompanhar o desempenho dentro da experiência gamificada e estimula a participação.

### 3.8 Slides

Na seção Slides, o estudante encontra os materiais disponibilizados pelo professor.

Podem ser utilizados links, apresentações, arquivos PDF, PowerPoint e imagens.

Isso permite consultar conteúdos das aulas diretamente pela plataforma.

### 3.9 Gráficos

A seção Gráficos apresenta informações sobre os acertos e erros nas missões da turma.

O estudante também consegue consultar seu próprio aproveitamento.

Assim, consegue identificar seus avanços e perceber quais conteúdos precisam de mais atenção.

### 3.10 Loja virtual

A loja permite utilizar as moedas conquistadas durante as atividades.

Entre os itens disponíveis estão:
- Avatares.
- Símbolos especiais.
- Cores personalizadas.
- Efeitos de escrita.
- Temas visuais.
- Cartões de XP.

Depois de adquirir um item, o estudante pode acessar a seção Conquistas e personalizar seu perfil.

### 3.11 Conquistas

As conquistas representam objetivos alcançados durante a jornada.

O estudante pode desbloquear medalhas ao completar missões, alcançar determinados níveis e demonstrar conhecimentos nas diferentes áreas da Matemática.

A seção também permite equipar itens adquiridos na loja e visualizar seu inventário.

### 3.12 Perfil

No perfil, o estudante pode visualizar suas informações, alterar sua foto ou avatar, consultar seu nível, XP, moedas, turma e personalizações.

Também pode alterar sua senha e gerenciar sua conta.

## 4. Ambiente do professor

O professor possui ferramentas próprias para organizar as turmas, publicar atividades e acompanhar a participação dos estudantes.

### 4.1 Visão geral

O painel apresenta informações da turma selecionada, incluindo:
- Quantidade de estudantes matriculados.
- Número de missões publicadas.
- Conclusões confirmadas.
- Atividades disponibilizadas.

### 4.2 Estudantes

Nessa seção, o professor pode visualizar os estudantes vinculados à turma.

Também pode:
- Compartilhar o código de acesso.
- Adicionar estudantes por ID ou e-mail.
- Criar novas turmas.
- Alterar nomes das turmas.
- Gerenciar os estudantes vinculados.

### 4.3 Publicação de missões

O professor pode criar atividades personalizadas para os estudantes.

Para publicar uma missão, informa o assunto, título, fonte, prazo, habilidade avaliada e enunciado.

Também pode escolher o formato de resposta, adicionar imagens e criar capítulos adicionais.

Cada missão possui uma quantidade de XP e moedas definida pelo professor.

Após a publicação, a atividade aparece na Jornada dos estudantes da turma correspondente.

### 4.4 Correção e acompanhamento

O professor pode visualizar como o estudante verá cada missão e acompanhar as respostas recebidas.

Nas respostas escritas, pode confirmar ou recusar a conclusão.

Também pode liberar uma nova tentativa quando o estudante erra uma questão de múltipla escolha.

Quando confirma uma resposta escrita, o estudante recebe as recompensas correspondentes.

### 4.5 Slides

O professor pode publicar materiais de aula utilizando links ou arquivos.

Os conteúdos ficam disponíveis na seção Slides dos estudantes vinculados à turma.

### 4.6 Ranking e gráficos

O professor consegue consultar o ranking da turma e visualizar gráficos de acertos e erros.

Essas informações ajudam a identificar a participação dos estudantes e os assuntos que podem precisar de maior atenção.

### 4.7 Relatórios

A seção Relatórios reúne informações sobre:
- Estudantes.
- Missões concluídas.
- XP acumulado.
- Resultados por habilidade matemática.

Também permite exportar os dados em formato CSV para análises posteriores.

### 4.8 Gestão da loja e conquistas

O professor pode criar novas conquistas, definir condições para desbloqueá-las e concedê-las manualmente aos estudantes.

Também pode cadastrar novos itens na loja, definindo nome, descrição, preço, categoria e aparência.

### 4.9 Atividades em sala

Essa ferramenta permite registrar atividades realizadas presencialmente.

O professor informa o nome da atividade, define a quantidade de XP e moedas e seleciona os estudantes que receberão a recompensa.

Dessa forma, a evolução pode reconhecer também a participação nas atividades realizadas em sala de aula.

### 4.10 Contas

O professor pode criar contas para estudantes, individualmente ou em grupos.

Isso facilita a organização dos acessos e a inclusão dos estudantes na turma.

### 4.11 Loja, conquistas e perfil do professor

O professor também possui sua própria evolução dentro da plataforma.

Pode acumular XP e moedas, conquistar medalhas, utilizar a loja e personalizar seu perfil.

## 5. Objetivo final da plataforma

O MathXP busca aproximar a Matemática de uma experiência de aprendizagem mais participativa.

A plataforma conecta atividades escolares a desafios, metas, experiência, moedas virtuais, conquistas e acompanhamento pedagógico.

O objetivo não é simplesmente transformar a Matemática em uma competição, mas permitir que cada estudante acompanhe sua própria evolução, reconheça suas dificuldades e continue aprendendo.
